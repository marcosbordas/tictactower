name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: Tipo de build (debug rapido / release firmado)
        type: choice
        default: debug
        options:
          - debug
          - release

env:
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (para keystore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        run: |
          mkdir -p keys
          if [[ "${BUILD_TYPE}" == "release" && -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keys/tictactower.keystore
          else
            keytool -genkeypair -v -keystore keys/tictactower.keystore -alias tictactower \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass tictactower2026 -keypass tictactower2026 \
              -dname "CN=Marcos Bordas Gonzalez, OU=Games, O=MarcosBordas, L=Havana, ST=La Habana, C=CU"
            echo "NEW_KEYSTORE_CREATED=1" >> "$GITHUB_ENV"
          fi

      - name: Build (debug)
        if: env.BUILD_TYPE == 'debug'
        uses: docker://kivy/buildozer:latest
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        with:
          args: "android debug"

      - name: Build (release)
        if: env.BUILD_TYPE == 'release'
        uses: docker://kivy/buildozer:latest
        env:
          BUILDOZER_WARN_ON_ROOT: 0
        with:
          args: "android release"

      - name: Show fingerprint of new keystore
        if: env.NEW_KEYSTORE_CREATED == '1'
        run: |
          keytool -list -v -keystore keys/tictactower.keystore \
            -storepass tictactower2026 -alias tictactower \
            | grep -A1 "SHA1\|SHA256" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-tictactower-${{ env.BUILD_TYPE }}
          path: |
            bin/*.apk
            bin/*.aab
            keys/tictactower.keystore
          if-no-files-found: warn